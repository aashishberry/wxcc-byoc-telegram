services:
  - type: web
    name: wxcc-byoc-telegram-middleware
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-byoc-telegram-db
          property: connectionString
      - key: TEMP_ATTACHMENT_SIGNING_SECRET
        generateValue: true
      - key: TELEGRAM_INBOUND_ATTACHMENTS_ENABLED
        value: "false"
      - key: TELEGRAM_MAX_ATTACHMENT_BYTES
        value: "10485760"
      - key: TELEGRAM_INBOUND_MAX_ATTACHMENT_BYTES
        value: "10485760"

databases:
  - name: wxcc-byoc-telegram-db
    plan: free
    region: singapore
    databaseName: wxcc_byoc_telegram
    user: wxcc_byoc_telegram
