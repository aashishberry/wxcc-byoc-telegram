services:
  - type: web
    name: wxcc-byoc-telegram-middleware
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-byoc-telegram-db
          property: connectionString

databases:
  - name: wxcc-byoc-telegram-db
    plan: free
    region: singapore
    databaseName: wxcc_byoc_telegram
    user: wxcc_byoc_telegram
